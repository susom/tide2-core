# Example config for: tide2-runner run <job_type> --config this_file.yaml
#
# All keys match CLI arg names (with underscores).
# CLI flags always override config values.
#
# Job types: recognizer, anonymizer, transformer, pipeline, llm-recognizer

# =========================================================================
# Job settings (all job types)
# =========================================================================
mode: vm
input: /mnt/gcs/standalone_anonymizer/input
output: /mnt/gcs/standalone_anonymizer/output
# Size unset knobs from the detected hardware profile (default: true). Values set
# anywhere in this file always win. Set to false to run the pre-autotune defaults —
# benchmarks should, so their settings do not change with the host.
hardware_autotune: true

# Pipeline execution mode (pipeline jobs only). Default and production value is
# "discrete": every stage is its own Ray Data execution with a Parquet boundary
# between them. That boundary is what lets the GPU stage run on one machine and
# the CPU stages elsewhere as independent jobs, and it is what row-level resume
# (enable_checkpoint) is keyed to — so multi-machine, unattended, and ≲4-CPU runs
# must stay here. "streamed" chains the stages into one single-node execution:
# faster for development, benchmarks and single-box batches, but no resume, only
# 06_anonymizer_output is written, and note_text stays in the object store (and
# may spill to local disk) for the whole run.
execution_mode: discrete

# =========================================================================
# Ray cluster tuning (all job types)
# =========================================================================
num_cpus: 224
# num_gpus: 1
object_store_gb: 100

# =========================================================================
# Actor tuning (recognizer, anonymizer, pipeline)
# =========================================================================
# num_actors / worker_num_cpus are left unset on purpose: the hardware recommender
# sizes them from the detected node shape. Uncomment only to override the
# recommendation. worker_num_cpus is the CPU reservation per actor slot.
# num_actors: 200
# worker_num_cpus: 1
batch_size: 200

# =========================================================================
# Read tuning (recognizer, anonymizer)
# =========================================================================
read_parallelism: 200
read_cpus: 0.25
read_op_min_num_blocks: 200
target_max_block_size_mb: 128
target_min_block_size_mb: 1
# no_progress_timeout_s: 600.0  # Ray Data execution-level hang guard (seconds; -1 disables)

# =========================================================================
# Anonymizer-specific
# =========================================================================
salt: /mnt/gcs/tide2/arpah_prod_salt.key
key: /mnt/gcs/tide2/arpah_prod_key.key
# acc_num_salt: "your-salt-here"
# acc_num_study_id: "your-study-id-here"
# jitter_required: false

# =========================================================================
# Transformer-specific
# =========================================================================
# model: "StanfordAIMI/stanford-deidentifier-v2"
# model_path: /path/to/local/model
# bucket_name: "your-gcs-bucket"
# project_id: "your-gcp-project"
# chunk_overlap: 40  # token overlap between windows (per-window budget = model's MODEL_MAX_LENGTH)
# batch_size: whole notes per actor call (host-memory knob; GPU stays bounded by gpu_batch_size)
# gpu_batch_size: token windows per GPU forward; size for the load (actor halves and retries on OOM)
# num_agg_actors: auto-computed as ~30% of available CPUs

# =========================================================================
# LLM Recognizer-specific (llm-recognizer and pipeline jobs)
# =========================================================================
# provider_type: "google"            # LLM provider: google, openai, anthropic, llama, medgemma
# context_length: 1048576            # Model context window in tokens
# max_tokens: 16384                  # Maximum LLM output tokens
# temperature: 0.0                   # Model temperature for response generation
# region: "us-central1"              # Cloud region for LLM API
# endpoint_id: null                  # Vertex AI endpoint ID (optional)
# max_retries: 3                     # Maximum retry attempts for failed LLM requests

# =========================================================================
# Pipeline-specific (tide2-runner run pipeline)
# =========================================================================
# run_transformer: true
# run_recognizer: true
# run_anonymizer: true
# produce_visualizer_json: false
# salt_hex: "00" * 32
# key_hex: "11" * 32
# cpu_batch_size: 100
# llm_recognizer_mode: "off"        # "off", "only", or "merge"
# llm_project_id: "your-gcp-project"  # GCP project for LLM API (defaults to project_id)
# llm_model: "gemini-2.5-flash"       # LLM model name

# =========================================================================
# Flags
# =========================================================================
dry_run: false
log_level: INFO
